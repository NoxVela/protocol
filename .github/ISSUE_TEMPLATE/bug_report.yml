name: Bug Report
description: Report an issue, serialization defect, or unexpected behavior in NoxVela.Protocol
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.
  - type: input
    id: version
    attributes:
      label: Protocol Version
      description: What version of NoxVela.Protocol are you using? (e.g. 1.0.0)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the protocol or library is affected?
      options:
        - "C# Library (NoxVela.Protocol)"
        - "JSON Serialization (System.Text.Json)"
        - "MessagePack Serialization"
        - "AsyncAPI 3.1 Specification (spec/asyncapi.yaml)"
        - "Documentation / Integration Guide"
        - "Protocol Generator Tooling"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce & Sample Payload
      description: Steps to reproduce the behavior or sample message payload (JSON / MessagePack).
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: .NET SDK version, OS, runtime architecture (e.g. .NET 10.0.100, Ubuntu 24.04 x64).
      placeholder: ".NET 10.0, Linux / Windows x64"
    validations:
      required: false
